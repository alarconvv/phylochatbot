version: '3.8'
services:
  phylochatbot:
    build: .
    container_name: phylochatbot_app
    expose:
      - "3838"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always

  nginx:
    image: nginx:alpine
    container_name: phylochatbot_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - phylochatbot
    restart: always
